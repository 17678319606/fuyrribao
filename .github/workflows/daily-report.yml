# 副业日报每日生成流水线（混合触发版 v3）
name: 副业日报每日生成

on:
  schedule:
    - cron: '40 11 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制更新今日文章（覆盖已发布内容，用于修正排版）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: fuyrribao-daily
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  WP_URL: https://dajiayouxuan.com
  WP_USER: tougao
  WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
  WP_CATEGORY_NAME: 日报
  AI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
  AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  AI_MODEL: ${{ secrets.AI_MODEL || 'gemini-flash-latest' }}
  AI_BASE_URL_POOL: ${{ secrets.AI_BASE_URL_POOL }}
  AI_FALLBACK_URL: https://ai.jinbufenzi.com/v1
  AI_FALLBACK_KEY: ${{ secrets.AI_SIDEHUSTLE_API_KEY }}
  AI_FALLBACK_MODEL: auto
  AI_ENABLE_FALLBACK: '0'
  AI_PROXY_POOL: ${{ secrets.AI_PROXY_POOL }}
  AI_REQUEST_TIMEOUT: ${{ secrets.AI_REQUEST_TIMEOUT }}
  AI_FORCE_NON_STREAM: ${{ secrets.AI_FORCE_NON_STREAM }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && '1' || '0' }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests beautifulsoup4 feedparser lxml pysocks

      - name: 去重早退检查（今日已发布则跳过）
        id: preflight
        run: |
          python - <<'PY'
          import os, sys, base64, requests, datetime
          out = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          BJ = datetime.timezone(datetime.timedelta(hours=8))
          today = datetime.datetime.now(BJ).strftime("%Y-%m-%d")
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          try:
              wp = os.environ["WP_URL"].rstrip("/")
              auth = {"Authorization": "Basic " + base64.b64encode(f'{os.environ["WP_USER"]}:{os.environ["WP_APP_PASSWORD"]}'.encode()).decode()}
              r = requests.get(wp + "/wp-json/wp/v2/posts", params={"search": today, "status": "publish", "per_page": 20}, headers=auth, timeout=30)
              r.raise_for_status()
              for p in r.json():
                  t = p.get("title", {}).get("rendered", "")
                  pdate = (p.get("date") or "")[:10]
                  if "副业日报" in t and (today in t or pdate == today):
                      if event == "schedule":
                          print("今日文章已存在，定时备用跳过生成。")
                          open(out, "a").write("skip=1\n")
                          sys.exit(0)
                      print("检测到今日文章，派发运行将继续覆盖更新。")
          except Exception as e:
              print("WP 查询失败，继续生成:", e)
          open(out, "a").write("skip=0\n")
          PY

      - name: 采集信号（只执行一次）
        if: steps.preflight.outputs.skip != '1'
        run: |
          for i in 1 2; do
            if python scripts/fetch_signals.py; then exit 0; fi
            [ "$i" -lt 2 ] && sleep 10
          done
          exit 1

      - name: AI 生成日报（仅重试生成，不重抓信号）
        if: steps.preflight.outputs.skip != '1'
        run: |
          for i in 1 2 3; do
            if python scripts/generate_report.py; then exit 0; fi
            [ "$i" -lt 3 ] && sleep 15
          done
          exit 1

      - name: 发布到 WordPress（仅重试发布，不重抓/重生成）
        if: steps.preflight.outputs.skip != '1'
        run: |
          for i in 1 2 3; do
            if python scripts/publish_wp.py; then exit 0; fi
            [ "$i" -lt 3 ] && sleep 15
          done
          exit 1
