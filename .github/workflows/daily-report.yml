# 副业日报每日生成流水线（GitHub 主力版 v4 · 唯一发布方）
# ─────────────────────────────────────────────────────────────────────
# 触发方式：
#   1. 定时发布：由宝塔服务器 trigger_daily.sh 每日 19:00（北京时间）经 workflow_dispatch 触发；
#      这是日常自动化的唯一发布入口（单发布方治理，杜绝双发）。
#   2. 手动触发：workflow_dispatch（支持 force 强制重渲染 / clean 清洁模式）。
#   3. 应急 / 重渲染专用。
#
# 重要：CNB（.cnb.yml，北京时间 06:00 / 19:00）仅做"生成 + 诊断"，
#       已设 FUYR_DISABLE_PUBLISH=1 跳过 WordPress 发布，不会与本职发布方冲突。
#       GitHub Actions 才是唯一的真实发布方（详见仓库根 trigger_daily.sh）。
#
# AI 后端：Gemini 原生 API 主用（AI Studio AQ. 密钥），璇玑 ai.jinbufenzi.com 作兜底（env 中配置）
# 发布目标：WordPress + 公众号（freepublish，由 WP 插件在源站直连微信 API）
# 密钥全部走 GitHub Secrets，绝不硬编码。
name: 副业日报每日生成

on:
  # 单发布方治理：本 workflow 无自有 schedule，避免与任何定时源重复发稿。
  # 日常自动化由宝塔 trigger_daily.sh 每日 19:00（北京时间）经 workflow_dispatch 触发；
  # CNB 流水线仅做诊断（FUYR_DISABLE_PUBLISH=1），GitHub Actions 为唯一发布方。
  workflow_dispatch:
    inputs:
      force:
        description: '强制更新今日文章（覆盖已发布内容）'
        required: false
        default: 'false'
      target_date:
        description: '目标日期(YYYY-MM-DD)，用于重生成/清洁历史文章；留空=今天'
        required: false
        default: ''
      clean:
        description: '清洁模式：忽略历史累积、全新生成（覆盖重写旧文，无需手工删缓存）'
        required: false
        default: 'false'
      emergency:
        description: '应急模式：放宽质量门(填空白视角/清理占位符/实质门禁放行)，仅用于 AI 主用不可用时保发布；博彩/引流安全闸仍生效'
        required: false
        default: 'false'

permissions:
  contents: write               # 仅用于提交心跳 / 去重状态 / 产物回仓库

concurrency:
  group: fuyrribao-daily
  cancel-in-progress: false    # 同一时刻只允许一个运行；避免宝塔触发与备用定时并发导致双发

env:
  TZ: Asia/Shanghai
  DOCGEN_TARGET_DATE: ${{ github.event.inputs.target_date }}
  DOCGEN_CLEAN: ${{ github.event.inputs.clean }}
  DOCGEN_EMERGENCY: ${{ github.event.inputs.emergency == 'true' && '1' || '' }}
  # —— WordPress ——（地址/账号/分类已在代码默认，这里只放应用密码）
  WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
  # —— AI 主用 Gemini 原生 API（AI Studio AQ. 密钥，仅支持原生端点 generativelanguage.googleapis.com/v1beta）——
  AI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
  AI_MODEL: gemini-flash-latest
  # 主用 key：AI_BASE_URL 指向 Gemini 原生 → 代码自动回落 GEMINI_API_KEY（generate_report.py 1347-1351）
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # —— 兜底：璇玑国内网关（主用不可达/限流/额度耗尽时自动回退，不宕机）——
  AI_FALLBACK_URL: https://ai.jinbufenzi.com/v1
  AI_FALLBACK_KEY: ${{ secrets.AI_SIDEHUSTLE_API_KEY }}
  AI_FALLBACK_MODEL: auto
  # 公众号推送已移交 WordPress 插件（fuyr-wechat-pusher）在源站直连微信 API，
  # CI 不再注入任何 WX_* 密钥/代理；AppID/AppSecret 仅存于 WP 后台设置页。
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && '1' || '0' }}
  # —— 企业微信通知 ——
  WXWORK_WEBHOOK: ${{ secrets.WXWORK_WEBHOOK }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests beautifulsoup4 feedparser lxml pysocks Pillow

      - name: 注入 AI 限速器（免费 Gemini 配额保护，防 429）
        run: python scripts/patches/apply_rate_limit.py

      - name: 恢复状态缓存（seen.json / CID 快照 / 当日累积日报，走缓存而非提交 git，避免仓库膨胀）
        id: statecache
        uses: actions/cache/restore@v4
        with:
          path: |
            state/
          key: fuyrribao-state-${{ github.run_id }}
          restore-keys: |
            fuyrribao-state-

      # ---------- 同日增量累积：定时始终执行（由累积逻辑增量刷新），仅在「线上当日文章渲染器版本过旧」时强制重渲染 ----------
      - name: 渲染器版本检查（决定是否强制重渲染以落地修复）
        id: preflight
        run: |
          python - <<'PY'
          import os, sys, base64, requests, datetime
          sys.path.insert(0, "scripts")
          import common as C
          out = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          envf = os.environ.get("GITHUB_ENV", "/dev/null")
          BJ = datetime.timezone(datetime.timedelta(hours=8))
          target_date = os.environ.get("DOCGEN_TARGET_DATE", "").strip()
          today = target_date or datetime.datetime.now(BJ).strftime("%Y-%m-%d")
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          force_update = os.environ.get("FORCE_UPDATE", "") == "1"
          post_content = ""
          try:
              wp = os.environ.get("WP_URL", "https://dajiayouxuan.com").rstrip("/")
              auth = {"Authorization": "Basic " + base64.b64encode(
                  f'{os.environ.get("WP_USER", "tougao")}:{os.environ.get("WP_APP_PASSWORD", "")}'.encode()).decode()}
              r = requests.get(wp + "/wp-json/wp/v2/posts",
                               params={"search": "副业日报", "status": "publish", "per_page": 20},
                               headers=auth, timeout=30)
              r.raise_for_status()
              for p in r.json():
                  t = p.get("title", {}).get("rendered", "")
                  pdate = (p.get("date") or "")[:10]
                  if "副业日报" in t and (today in t or pdate == today):
                      post_content = p.get("content", {}).get("rendered", "")
                      break
          except Exception as e:
              print("WP 查询失败，继续生成:", e)
          live_ver = C.extract_renderer_version(post_content)
          # 仅当线上当日文章渲染器版本过旧（或用户手动勾选 force）时，强制重渲染已累积内容以落地修复；
          # 定时运行始终执行（由同日累积逻辑增量刷新，不再早退跳过，避免修复永不落地）。
          force_rerender = (live_ver < C.RENDERER_VERSION and post_content != "") or force_update
          open(envf, "a").write("DOCGEN_FORCE_RERENDER=%s\n" % ("1" if force_rerender else "0"))
          # 末波判定：北京时间 19:00 及之后、06:00 之前、或手动触发(workflow_dispatch) → 末波。
          # 末波需输出「覆盖全天」的心法总结，并放宽上限至 60 条；非末波（晨间首波）上限 30 条。
          # 该值在 preflight 写出到 GITHUB_ENV，供 generate_report.py 读取（覆盖其回退判定）。
          bj_hour = datetime.datetime.now(BJ).hour
          is_final = (event == "workflow_dispatch") or bool(target_date) or bj_hour >= 19 or bj_hour < 6
          open(envf, "a").write("DOCGEN_IS_FINAL=%s\n" % ("1" if is_final else "0"))
          open(out, "a").write("skip=0\n")
          print("live_renderer_version=%s, current=%s, force_rerender=%s, is_final=%s (event=%s)"
                % (live_ver, C.RENDERER_VERSION, force_rerender, is_final, event))
          PY

      - name: 采集 + AI 生成 + 发布（高延迟 AI 收敛重试）
        if: steps.preflight.outputs.skip != '1'
        run: |
          STEP_START=$(date +%s)
          MAX_TRIES=2
          for i in $(seq 1 $MAX_TRIES); do
            echo "===== 第 $i/$MAX_TRIES 轮尝试（采集→AI→发布） ====="
            if python scripts/fetch_signals.py \
               && python scripts/generate_report.py \
               && python scripts/publish_wp.py; then
              STEP_END=$(date +%s)
              echo "✅ 第 $i 轮成功完成日报生成与发布，本步骤耗时 $((STEP_END - STEP_START))s"
              break
            fi
            if [ "$i" -lt "$MAX_TRIES" ]; then
              echo "⚠️ 第 $i 轮失败（疑似网络抖动/源站超时），90s 后自愈重试…"
              sleep 90
            else
              STEP_END=$(date +%s)
              echo "❌ 已重试 $MAX_TRIES 次仍失败，本步骤总耗时 $((STEP_END - STEP_START))s"
              exit 1
            fi
          done

      - name: 发布后合规扫描（命中博彩/引流即自动删帖并告警）
        if: success()
        run: python scripts/wp_safety_scan.py

      # 公众号推送已移交 WordPress 插件（fuyr-wechat-pusher）在源站直接调用微信 API 处理，
      # 利用服务器已在白名单的出口 IP，无需 CI 侧代理。故此处不再调用 publish_wechat.py，
      # 避免与插件双重推送。CNB 侧通过 run_daily.py 的 WX_PUSH_VIA_WP 网关同样跳过 wechat 步骤。

      - name: 保存状态缓存（seen.json / CID 快照 / 当日累积日报，更新后持久化，下次运行 restore-keys 回退到最新）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/
          key: fuyrribao-state-${{ github.run_id }}

      - name: 源抓取失败告警（非致命）
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, json, urllib.request
          p = "state/source_status.json"
          if not os.path.exists(p):
              raise SystemExit(0)
          try:
              d = json.load(open(p, encoding="utf-8"))
          except Exception:
              raise SystemExit(0)
          status = d.get("status", {})
          failed = [k for k, v in status.items() if not v.get("ok")]
          total_cand = d.get("total_candidates", -1)
          alerts = []
          if failed:
              alerts.append("有 %d 个内容源抓取失败：%s" % (len(failed), ", ".join(failed)))
          if total_cand == 0:
              alerts.append("今日候选信号为 0（所有源可能均失败或暂无可抓取内容），日报可能为空")
          if not alerts:
              print("✅ 所有内容源抓取正常")
              raise SystemExit(0)
          msg = "【副业日报】" + "；".join(alerts) + "\n请检查源可用性（不影响已成功源的日报生成）。"
          payload = json.dumps({"msgtype": "text", "text": {"content": msg}}).encode("utf-8")
          url = "${{ secrets.WXWORK_WEBHOOK || '<WXWORK_WEBHOOK_PLACEHOLDER>' }}"
          try:
              req = urllib.request.Request(url, data=payload,
                                           headers={"Content-Type": "application/json"}, method="POST")
              urllib.request.urlopen(req, timeout=10)
              print("已发送源失败告警:", failed)
          except Exception as e:
              print("源失败告警发送失败:", e)
          PY

      - name: 心跳提交（防 60天停用 + 回写状态）
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date '+%F %T')" > state/heartbeat.txt
          git add state/heartbeat.txt || true
          git diff --cached --quiet || git commit -m "daily: $(TZ=Asia/Shanghai date +%F) [heartbeat]"
          git reset --hard
          git clean -fd
          git fetch origin
          for j in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              echo "✅ 状态已回写仓库"
              break
            fi
            if [ -n "$(git ls-files -u)" ]; then
              git checkout --theirs -- state/heartbeat.txt 2>/dev/null || true
              git add -A 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue 2>/dev/null || true
            fi
            echo "git push 第 $j/3 次失败（可能远端已更新），5s 后重试…"
            sleep 5
          done

      - name: 判断是否为末次触发（通知策略）
        id: notify_check
        run: |
          # 通知策略：
          #   - 手动触发(workflow_dispatch)：每次都通知（测试/开发需要）
          #   - 定时触发(schedule)：
          #       - 19:01（晚间）= 末次触发 → 成功/失败都通知
          #       - 06:01（晨间）= 非末次 → 仅失败才通知（成功则静默）
          BJ=$(TZ=Asia/Shanghai date +%H%M)
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "notify=always" >> "$GITHUB_OUTPUT"
            echo "is_final=true" >> "$GITHUB_OUTPUT"
          elif [ "$BJ" -ge "1900" ] || [ "$BJ" -lt "0600" ]; then
            echo "notify=always" >> "$GITHUB_OUTPUT"
            echo "is_final=true" >> "$GITHUB_OUTPUT"
          else
            echo "notify=failure_only" >> "$GITHUB_OUTPUT"
            echo "is_final=false" >> "$GITHUB_OUTPUT"
          fi
          echo "bj_time=$BJ event=$EVENT"

      - name: 末次汇总通知（企业微信）
        if: always() && steps.notify_check.outputs.notify == 'always'
        run: |
          RESULT="${{ job.status }}"
          BJ_TIME="${{ steps.notify_check.outputs.bj_time }}"
          IS_FINAL="${{ steps.notify_check.outputs.is_final }}"
          URL="${{ secrets.WXWORK_WEBHOOK || '<WXWORK_WEBHOOK_PLACEHOLDER>' }}"
          if [ "$URL" = "<WXWORK_WEBHOOK_PLACEHOLDER>" ]; then
            echo "⚠️ 未配置 WXWORK_WEBHOOK，跳过通知"
            exit 0
          fi
          if [ "$RESULT" = "success" ]; then
            MSG="✅ **副业日报流水线成功**（${BJ_TIME} 北京时间）
            > 日期：$(TZ=Asia/Shanghai date '+%Y-%m-%d')
            > 触发类型：${{ github.event_name == 'workflow_dispatch' && '手动' || '定时' }}
            > 是否末次：${IS_FINAL}
            >
            > 文章已发布到 WordPress，公众号由 WP 插件自动推送。
            > [查看运行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            MSG="❌ **副业日报流水线失败**（${BJ_TIME} 北京时间）
            > 请尽快检查：[查看运行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          curl -s -o /dev/null -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c "import json;print(json.dumps({'msgtype':'markdown','markdown':{'content':'''$MSG'''}}))")"
          echo "通知已发送（result=$RESULT, is_final=$IS_FINAL)"
