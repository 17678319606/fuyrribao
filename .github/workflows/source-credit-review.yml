# 源征信月检流水线（容错 · 死源复活重纳）
# ─────────────────────────────────────────────────────────────────────
# 目标：每月月末对 retired（淘汰但保留记录）的内容源重新实拉取校验；
#       若源已恢复且信用分达标、且连续 2 次巡检成功，则自动重纳为 trial（再观测）。
#       这层"征信"让短暂故障的好源不会永久丢失，提升整体容错率（详见 product-strategy 审计）。
# 触发：
#   1. 定时：每月 28 日 18:00 UTC（北京 29 日 02:00）月检；
#   2. 手动：workflow_dispatch（可勾选 dry_run 仅评估不落地）。
# 成本：每个 retired 源仅一次 HTTP 校验（零 LLM），免费额度内；retired 源通常 ≤20。
# 安全：落地仅改 scripts/sources.json 的 status 字段，并留痕 state/source_credit_review.json。

name: 源征信月检（死源复活）

on:
  schedule:
    - cron: '0 18 28 * *'   # 北京 每月29日 02:00（UTC 28日 18:00）；月末近似触发
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅评估不落地 sources.json（仍输出日志）'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  credit-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet requests beautifulsoup4 feedparser lxml pysocks

      - name: 运行征信月检
        id: review
        run: |
          # dry_run=true → 仅审计不落地；否则默认 --apply 自动重纳
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS=""; else ARGS="--apply"; fi
          REVIEW_OUTPUT="$(python scripts/source_manager.py review-retired $ARGS 2>&1)" || true
          echo "$REVIEW_OUTPUT"

      - name: 提交重纳结果（若有）
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/sources.json state/source_credit_review.json
          git diff --cached --quiet || git commit -m "source: 征信月检重纳复活源 ($(TZ=Asia/Shanghai date +%F))"
          for j in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              echo "✅ 征信月检结果已提交"; break
            fi
            echo "push 第 $j/3 次失败，5s 后重试"; sleep 5
          done

      - name: 月检日志（企业微信通知，可选）
        if: always()
        run: |
          python - <<'PY'
          import os, json
          p = "state/source_credit_review.json"
          if not os.path.exists(p):
              raise SystemExit(0)
          try:
              d = json.load(open(p, encoding="utf-8"))
          except Exception:
              raise SystemExit(0)
          acts = d.get("actions", [])
          print("征信月检 %d 项：" % len(acts))
          for a in acts:
              print(" -", a.get("type"), a.get("id"), a.get("credit"), a.get("detail", ""))
          PY
