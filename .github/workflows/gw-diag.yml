# 网关诊断（只读）：用生产级大 prompt 验证 enable_thinking:false 能否压制推理、稳定返回
# 含全部必需模块的 JSON（避免再次 20 分钟失败 run）。仅 jinbufenzi 网关生效。
name: 网关诊断-gw-diag

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AI_FALLBACK_URL: https://ai.jinbufenzi.com/v1
  AI_FALLBACK_KEY: ${{ secrets.AI_SIDEHUSTLE_API_KEY }}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 安装依赖
        run: pip install --quiet requests
      - name: 大 prompt 验证 enable_thinking
        run: |
          python - <<'PY'
          import os, json, socket, urllib.request, urllib.parse, time, random
          import requests

          KEY = os.environ["AI_FALLBACK_KEY"]
          BASE = os.environ.get("AI_FALLBACK_URL", "https://ai.jinbufenzi.com/v1").rstrip("/")
          HEAD = {"Authorization": f"Bearer {KEY}", "Content-Type": "application/json",
                  "Accept": "application/json"}

          def doh_resolve(host):
              providers = [
                  ("Google", "https://dns.google/resolve?name=%s&type=A" % host, {"Accept": "application/dns-json"}),
                  ("Cloudflare", "https://cloudflare-dns.com/dns-query?name=%s&type=A" % host, {"Accept": "application/dns-json"}),
              ]
              ips = []
              for name, url, hdr in providers:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=10) as r:
                          d = json.loads(r.read())
                      ips += [a["data"] for a in d.get("Answer", []) if a.get("type") == 1]
                  except Exception as e:
                      print("DoH(%s) %s 失败: %s" % (name, host, e))
              seen, uniq = set(), []
              for ip in ips:
                  if ip not in seen: seen.add(ip); uniq.append(ip)
              return uniq

          _patched = {}
          def install_dns_patch(host):
              if host in _patched: return
              ips = doh_resolve(host)
              if not ips: print("DoH 无结果，走正常 DNS"); return
              target = ips[0]; orig = socket.getaddrinfo
              def patched(h, *a, **k):
                  if h == host:
                      port = a[0] if a and isinstance(a[0], int) else 443
                      return [(socket.AF_INET, socket.SOCK_STREAM, 6, "", (target, port))]
                  return orig(h, *a, **k)
              socket.getaddrinfo = patched; _patched[host] = target
              print("DNS 钉 IP: %s -> %s" % (host, target))

          install_dns_patch(urllib.parse.urlparse(BASE).netloc)

          # 构造生产级大 prompt：系统要求 3 模块 + 35 条候选信号
          SYSTEM = (
            "你是副业日报 AI。必须输出严格 JSON，包含 modules（project_opportunities / "
            "growth_operations / views_insights 三个数组，缺一不可）与 daily_summary"
            "（含 methodology 字符串与 evidence 数组）。禁止裸 URL。每条 item 含 title/"
            "source_name/source_url/signal。只输出 JSON，不要解释。"
          )
          random.seed(1)
          sigs = []
          for i in range(35):
              sigs.append({
                  "id": "s%d" % i,
                  "source_name": random.choice(["V2EX","少数派","ProductHunt","即刻","GitHub"]),
                  "title": "副业项目信号 #%d：用 AI 自动化某某流程赚钱的可行路径与风险提示" % i,
                  "content": "这是第 %d 条信号的详细描述，讨论如何通过独立开发/内容运营/工具变现实现副业收入，"
                             "包含具体方法、目标用户、变现点与需要注意的坑。" % i,
                  "published_at": "2026-08-14",
              })
          user = "今天是 2026-08-14（北京时间）。以下是当日增量信号（JSON）：\n```json\n%s\n```\n请输出副业日报 JSON。" % json.dumps(sigs, ensure_ascii=False)

          def extract_modules(buf):
              try:
                  s = buf.strip()
                  if "```" in s:
                      s = s.split("```")[1] if "```" in s.split("```")[1] else s
                  start = s.find("{"); 
                  if start == -1: return None
                  depth = 0; in_s = False; esc = False; end = -1
                  for i in range(start, len(s)):
                      ch = s[i]
                      if in_s:
                          if esc: esc = False
                          elif ch == "\\": esc = True
                          elif ch == '"': in_s = False
                          continue
                      if ch == '"': in_s = True
                      elif ch == "{": depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0: end = i; break
                  if end == -1: return None
                  obj = json.loads(s[start:end+1])
                  mods = obj.get("modules", {})
                  return {k: len(mods.get(k, [])) for k in
                          ("project_opportunities","growth_operations","views_insights")}
              except Exception:
                  return None

          def probe(label, extra=None):
              print("\n--- LARGE PROBE %s ---" % label)
              payload = {"model":"auto","messages":[{"role":"system","content":SYSTEM},
                          {"role":"user","content":user}],"stream":True,
                         "max_tokens":6000,"temperature":0.5}
              if extra: payload.update(extra)
              t0=time.time(); has_content=has_reasoning=False; n=0; buf=""
              try:
                  with requests.post(f"{BASE}/chat/completions", headers=HEAD, json=payload,
                                     stream=True, timeout=(20,300)) as resp:
                      resp.raise_for_status()
                      for raw in resp.iter_lines(decode_unicode=False):
                          if not raw: continue
                          line = raw.decode("utf-8","replace").strip()
                          if not line.startswith("data:"): continue
                          data = line[5:].strip()
                          if data == "[DONE]": break
                          try: obj=json.loads(data)
                          except: continue
                          ch=((obj.get("choices") or [{}])[0].get("delta") or {})
                          if ch.get("content"): has_content=True; buf+=ch["content"]
                          if ch.get("reasoning") or ch.get("reasoning_content"): has_reasoning=True
                          n+=1
                  mods = extract_modules(buf)
                  print("  耗时=%.1fs chunks=%d has_content=%s has_reasoning=%s" % (time.time()-t0,n,has_content,has_reasoning))
                  print("  modules=%s" % (mods,))
                  print("  content_len=%d" % len(buf))
              except requests.HTTPError as e:
                  print("  HTTP", e.response.status_code, e.response.text[:200])
              except Exception as e:
                  print("  ERR", repr(e), "耗时=%.1fs" % (time.time()-t0))

          probe("(control: 默认 auto，不关推理)")
          probe("(enable_thinking:false)", extra={"chat_template_kwargs":{"enable_thinking":False}})
          PY
