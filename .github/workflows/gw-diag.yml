# 网关诊断（只读，不发布）：用 requests 复用生产链路（DoH 钉 IP + stream 解析），
# 探测 auto 模型在不同 reasoning 关闭参数下的流式结构，定位能否稳定拿到 delta.content。
name: 网关诊断-gw-diag

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AI_FALLBACK_URL: https://ai.jinbufenzi.com/v1
  AI_FALLBACK_KEY: ${{ secrets.AI_SIDEHUSTLE_API_KEY }}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 安装依赖
        run: pip install --quiet requests
      - name: 诊断网关模型与流式结构
        run: |
          python - <<'PY'
          import os, json, socket, urllib.request, urllib.parse, time
          import requests

          KEY = os.environ["AI_FALLBACK_KEY"]
          BASE = os.environ.get("AI_FALLBACK_URL", "https://ai.jinbufenzi.com/v1").rstrip("/")
          HEAD = {"Authorization": f"Bearer {KEY}", "Content-Type": "application/json",
                  "Accept": "application/json"}

          # —— 复用生产 DoH 钉 IP（仅 jinbufenzi）——
          def doh_resolve(host):
              providers = [
                  ("Google", "https://dns.google/resolve?name=%s&type=A" % host, {"Accept": "application/dns-json"}),
                  ("Cloudflare", "https://cloudflare-dns.com/dns-query?name=%s&type=A" % host, {"Accept": "application/dns-json"}),
              ]
              ips = []
              for name, url, hdr in providers:
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=10) as r:
                          d = json.loads(r.read())
                      ips += [a["data"] for a in d.get("Answer", []) if a.get("type") == 1]
                  except Exception as e:
                      print("DoH(%s) %s 失败: %s" % (name, host, e))
              seen, uniq = set(), []
              for ip in ips:
                  if ip not in seen:
                      seen.add(ip); uniq.append(ip)
              return uniq

          _patched = {}
          def install_dns_patch(host):
              if host in _patched:
                  return
              ips = doh_resolve(host)
              if not ips:
                  print("DoH 无结果，走正常 DNS"); return
              target = ips[0]
              orig = socket.getaddrinfo
              def patched(h, *a, **k):
                  if h == host:
                      port = a[0] if a and isinstance(a[0], int) else 443
                      return [(socket.AF_INET, socket.SOCK_STREAM, 6, "", (target, port))]
                  return orig(h, *a, **k)
              socket.getaddrinfo = patched
              _patched[host] = target
              print("DNS 钉 IP: %s -> %s" % (host, target))

          install_dns_patch(urllib.parse.urlparse(BASE).netloc)

          # 1) 列模型
          print("=== GET /models ===")
          try:
              with requests.get(f"{BASE}/models", headers=HEAD, timeout=30) as r:
                  d = r.json()
              ids = [m.get("id") for m in d.get("data", [])]
              print("MODEL_COUNT=%d" % len(ids))
              for i in ids:
                  print("MODEL:", i)
          except Exception as e:
              print("LIST_MODELS_ERROR:", repr(e)); ids = ["auto"]

          # 2) 探测
          def probe(mid, extra=None, label=""):
              print(f"\n--- PROBE model={mid} {label} ---")
              payload = {
                  "model": mid,
                  "messages": [{"role": "user", "content":
                      '只返回 JSON：{"modules":{"project_opportunities":[],"growth_operations":[],"views_insights":[]},"daily_summary":{"methodology":"x","evidence":[]}}'}],
                  "stream": True, "max_tokens": 300, "temperature": 0.2,
              }
              if extra:
                  payload.update(extra)
              try:
                  has_content = has_reasoning = False
                  n = 0; buf = ""
                  with requests.post(f"{BASE}/chat/completions", headers=HEAD,
                                     json=payload, stream=True, timeout=(20, 120)) as resp:
                      resp.raise_for_status()
                      for raw in resp.iter_lines(decode_unicode=False):
                          if not raw:
                              continue
                          line = raw.decode("utf-8", "replace").strip()
                          if not line.startswith("data:"):
                              continue
                          data = line[5:].strip()
                          if data == "[DONE]":
                              break
                          try:
                              obj = json.loads(data)
                          except Exception:
                              continue
                          ch = ((obj.get("choices") or [{}])[0].get("delta") or {})
                          if ch.get("content"):
                              has_content = True; buf += ch["content"]
                          if ch.get("reasoning") or ch.get("reasoning_content"):
                              has_reasoning = True
                          n += 1
                  print("  chunks=%d has_content=%s has_reasoning=%s has_growth_ops=%s" % (
                      n, has_content, has_reasoning, ("growth_operations" in buf)))
                  print("  content_head=%r" % buf[:160])
              except requests.HTTPError as e:
                  print("  HTTP", e.response.status_code, e.response.text[:200])
              except Exception as e:
                  print("  ERR", repr(e))

          for mid in (ids[:8] or ["auto"]):
              probe(mid)
          probe("auto", extra={"chat_template_kwargs": {"enable_thinking": False}}, label="(disable_thinking vLLM)")
          probe("auto", extra={"reasoning": {"enabled": False}}, label="(reasoning.enabled=false)")
          probe("auto", extra={"think": False}, label="(think=false)")
          probe("auto", extra={"chat_template_kwargs": {"enable_thinking": False},
                               "reasoning": {"enabled": False}}, label="(both)")
          PY
