# 网关诊断（只读，不发布）：枚举 ai.jinbufenzi.com 可用模型，并探测每个模型流式返回结构
# 复用生产代码的 DoH 钉 IP 逻辑（仅 jinbufenzi host），否则海外 Runner 直连该域名会 Network unreachable。
name: 网关诊断-gw-diag

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AI_FALLBACK_URL: https://ai.jinbufenzi.com/v1
  AI_FALLBACK_KEY: ${{ secrets.AI_SIDEHUSTLE_API_KEY }}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 诊断网关模型与流式结构
        run: |
          python - <<'PY'
          import os, json, socket, urllib.request, urllib.error, urllib.parse, time

          KEY = os.environ["AI_FALLBACK_KEY"]
          BASE = os.environ.get("AI_FALLBACK_URL", "https://ai.jinbufenzi.com/v1").rstrip("/")
          HEAD = {"Authorization": f"Bearer {KEY}", "Content-Type": "application/json",
                  "Accept": "application/json"}

          # —— 复用生产 DoH 钉 IP 逻辑（仅 jinbufenzi）——
          def doh_resolve(host):
              import email.utils as eu
              providers = [
                  ("Google", "https://dns.google/resolve?name=%s&type=A" % host, {"Accept": "application/dns-json"}),
                  ("Cloudflare", "https://cloudflare-dns.com/dns-query?name=%s&type=A" % host, {"Accept": "application/dns-json"}),
              ]
              ips = []
              for name, url, hdr in providers:
                  try:
                      req = urllib.request.Request(url, headers=hdr)
                      with urllib.request.urlopen(req, timeout=10) as r:
                          d = json.loads(r.read())
                      found = [a["data"] for a in d.get("Answer", []) if a.get("type") == 1]
                      if found:
                          print("DoH(%s) %s -> %s" % (name, host, found))
                          ips.extend(found)
                  except Exception as e:
                      print("DoH(%s) %s 失败: %s" % (name, host, e))
              seen, uniq = set(), []
              for ip in ips:
                  if ip not in seen:
                      seen.add(ip); uniq.append(ip)
              return uniq

          _patched_hosts = {}
          def install_dns_patch(host):
              if host in _patched_hosts:
                  return
              ips = doh_resolve(host)
              if not ips:
                  print("DoH 无结果，放弃钉 IP，走正常 DNS")
                  return
              target = ips[0]
              orig = socket.getaddrinfo
              def patched(h, *args, **kwargs):
                  if h == host:
                      port = args[0] if args and isinstance(args[0], int) else 443
                      return [(socket.AF_INET, socket.SOCK_STREAM, 6, "", (target, port))]
                  return orig(h, *args, **kwargs)
              socket.getaddrinfo = patched
              _patched_hosts[host] = target
              print("DNS 钉 IP: %s -> %s" % (host, target))

          gw_host = urllib.parse.urlparse(BASE).netloc
          install_dns_patch(gw_host)

          def chat(payload, timeout=60):
              req = urllib.request.Request(f"{BASE}/chat/completions",
                                           data=json.dumps(payload).encode(), headers=HEAD, method="POST")
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r

          # 1) 列出可用模型
          print("=== GET /models ===")
          model_ids = []
          try:
              req = urllib.request.Request(f"{BASE}/models", headers=HEAD)
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.loads(r.read())
              model_ids = [m.get("id") for m in d.get("data", [])]
              print("MODEL_COUNT=%d" % len(model_ids))
              for i in model_ids:
                  print("MODEL:", i)
          except Exception as e:
              print("LIST_MODELS_ERROR:", repr(e))

          # 2) 探测流式结构
          def probe(mid, extra=None, label=""):
              print(f"\n--- PROBE model={mid} {label} ---")
              payload = {
                  "model": mid,
                  "messages": [{"role": "user", "content":
                      '只返回 JSON：{"modules":{"project_opportunities":[],"growth_operations":[],"views_insights":[]},"daily_summary":{"methodology":"x","evidence":[]}}'}],
                  "stream": True,
                  "max_tokens": 300,
                  "temperature": 0.2,
              }
              if extra:
                  payload.update(extra)
              try:
                  has_content = False
                  has_reasoning = False
                  n = 0
                  buf = ""
                  with chat(payload) as r:
                      for raw in r:
                          line = raw.decode("utf-8", "replace").strip()
                          if not line.startswith("data:"):
                              continue
                          data = line[5:].strip()
                          if data == "[DONE]":
                              break
                          try:
                              obj = json.loads(data)
                          except Exception:
                              continue
                          ch = ((obj.get("choices") or [{}])[0].get("delta") or {})
                          if ch.get("content"):
                              has_content = True; buf += ch["content"]
                          if ch.get("reasoning") or ch.get("reasoning_content"):
                              has_reasoning = True
                          n += 1
                  has_modules = ("growth_operations" in buf)
                  print(f"  chunks={n} has_content={has_content} has_reasoning={has_reasoning} has_growth_ops={has_modules}")
                  print(f"  content_head={buf[:160]!r}")
              except urllib.error.HTTPError as e:
                  print("  HTTP", e.code, e.read().decode()[:200])
              except Exception as e:
                  print("  ERR", repr(e))

          probe("auto", label="(current default)")
          for mid in model_ids[:8]:
              probe(mid)
          probe("auto", extra={"chat_template_kwargs": {"enable_thinking": False}}, label="(disable_thinking vLLM)")
          probe("auto", extra={"reasoning": {"enabled": False}}, label="(reasoning.enabled=false)")
          probe("auto", extra={"think": False}, label="(think=false)")
          PY
