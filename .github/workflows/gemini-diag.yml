# 一次性诊断：枚举 AQ. Auth key + project 94038486169 可访问的 Gemini 模型
# 仅在 sandbox 无法直连 googleapis.com 时，借海外 Runner 跑。跑完即删。
name: gemini-diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Gemini 模型诊断
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, urllib.parse

          KEY = os.environ.get("GEMINI_API_KEY", "")
          BASE = "https://generativelanguage.googleapis.com/v1beta"
          print("KEY prefix:", (KEY[:8] + "...") if KEY else "MISSING")

          def http(method, url, body=None):
              headers = {"Content-Type": "application/json"}
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()
              except Exception as e:
                  return 0, "ERR " + repr(e)

          # 1) 列出模型
          print("\n===== 1) LIST MODELS =====")
          st, txt = http("GET", f"{BASE}/models?key={KEY}")
          names = []
          if st == 200:
              try:
                  data = json.loads(txt)
                  names = [m.get("name", "") for m in data.get("models", [])]
                  interesting = [n for n in names if any(k in n.lower() for k in ("flash", "pro"))]
                  print(f"LIST OK，总模型数={len(names)}")
                  print("FLASH/PRO 模型：")
                  for n in interesting:
                      print("  ", n)
              except Exception as e:
                  print("LIST 解析失败:", e, txt[:300])
          else:
              print(f"LIST 失败 HTTP {st}:", txt[:400])

          # 2) 测试 generateContent（非流式，模型名合法性金标准）
          print("\n===== 2) generateContent 候选模型 =====")
          cands = [
              "gemini-2.5-flash", "gemini-2.5-flash-latest", "gemini-2.5-flash-lite",
              "gemini-2.5-pro", "gemini-2.5-pro-latest",
              "gemini-flash-latest", "gemini-pro-latest",
              "gemini-2.0-flash", "gemini-1.5-flash",
          ]
          good = []
          for m in cands:
              body = {
                  "contents": [{"role": "user", "parts": [{"text": "reply with exactly: OK"}]}],
                  "generationConfig": {"maxOutputTokens": 10},
              }
              st, txt = http("POST", f"{BASE}/models/{m}:generateContent?key={KEY}", body)
              if st == 200:
                  print(f"  [OK]   {m} -> {txt[:80]}")
                  good.append(m)
              else:
                  print(f"  [FAIL] {m} -> HTTP {st} {txt[:120]}")
          print("\n可用（generateContent 200）模型:", good or "无")

          # 3) 对首个可用模型测试 streamGenerateContent?alt=sse（我们代码用的流式路径）
          print("\n===== 3) streamGenerateContent?alt=sse（流式路径） =====")
          if good:
              m = good[0]
              body = {
                  "contents": [{"role": "user", "parts": [{"text": "reply with exactly: OK"}]}],
                  "generationConfig": {"maxOutputTokens": 10},
              }
              st, txt = http("POST", f"{BASE}/models/{m}:streamGenerateContent?alt=sse&key={KEY}", body)
              print(f"  模型 {m} streamGenerateContent?alt=sse -> HTTP {st}")
              print("  前 200 字符：", txt[:200].replace("\n", "\\n"))
          else:
              print("  无可用模型，跳过流式测试")
          PY
