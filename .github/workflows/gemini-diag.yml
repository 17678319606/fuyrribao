# 一次性诊断（聚焦）：打印全部 50 个模型名，并对 latest 别名单发确认 200
name: gemini-diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Gemini 模型诊断（聚焦）
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.error

          KEY = os.environ.get("GEMINI_API_KEY", "")
          BASE = "https://generativelanguage.googleapis.com/v1beta"
          print("KEY prefix:", (KEY[:8] + "...") if KEY else "MISSING")

          def http(method, url, body=None):
              headers = {"Content-Type": "application/json"}
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()
              except Exception as e:
                  return 0, "ERR " + repr(e)

          # 1) 打印全部模型名
          print("\n===== 全部模型名（共 50） =====")
          st, txt = http("GET", f"{BASE}/models?key={KEY}")
          if st == 200:
              for m in json.loads(txt).get("models", []):
                  print("  ", m.get("name", ""), "|", m.get("displayName", ""))
          else:
              print("LIST 失败 HTTP", st, txt[:300])

          # 2) 对 latest 别名单发确认（间隔 6s，避免 429 突发）
          print("\n===== 单发确认 latest 别名 =====")
          for m in ["gemini-flash-latest", "gemini-pro-latest"]:
              time.sleep(6)
              body = {
                  "contents": [{"role": "user", "parts": [{"text": "reply with exactly: OK"}]}],
                  "generationConfig": {"maxOutputTokens": 10},
              }
              st, txt = http("POST", f"{BASE}/models/{m}:generateContent?key={KEY}", body)
              print(f"  [HTTP {st}] {m} -> {txt[:120]}")
              # 顺带验流式 ?alt=sse
              time.sleep(6)
              st2, txt2 = http("POST", f"{BASE}/models/{m}:streamGenerateContent?alt=sse&key={KEY}", body)
              print(f"  [HTTP {st2}] {m} (stream?alt=sse) 前100: {txt2[:100].replace(chr(10),'\\\\n')}")
          PY
